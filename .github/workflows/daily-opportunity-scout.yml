name: Daily Opportunity Scout

on:
  workflow_dispatch:
  push:
    paths:
      - "SCOUT_TEST_TRIGGER.md"
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run daily research scout with GitHub Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SCOUT_PROMPT: |
            You are a DAILY OPPORTUNITY DISCOVERY ENGINE, not a summarizer.

            Read these files completely before doing anything:
            - MASTER_LIST.md
            - SCOUT_RULES.md
            - DAILY_DASHBOARD.md

            CORE MISSION
            Find genuinely NEW opportunity programs that are absent from MASTER_LIST.md, using broad current web research. Then update ONLY DAILY_DASHBOARD.md.

            USER PROFILE
            - India
            - B.Tech Artificial Intelligence & Data Science
            - graduating in 2028
            - prioritize undergraduate/early-career opportunities, open source, AI/ML, software/data, research, fellowships, internships, student communities, hackathons and high-value adjacent programs
            - no application-fee programs for active targeting
            - DRDO opportunities are excluded from active targeting
            - LLNL DSSI and UChicago DSI Summer Lab are historical records only and must not be re-added/recommended

            ============================================================
            PHASE 1 — BUILD A SEARCH PLAN BEFORE DECIDING "NO NEW ITEMS"
            ============================================================

            You MUST search broadly every run. Do NOT rely on memory, yesterday's dashboard, a small fixed list of programs, or search results from one query.

            Search at least these source families:

            A. OPEN SOURCE / CONTRIBUTOR PROGRAMS
            Search for current and upcoming:
            - Google Summer of Code / GSoC
            - Linux Foundation / LFX
            - Outreachy
            - Season of Docs / similar documentation programs
            - Summer of Code / student open-source programs
            - university open-source programs
            - major foundation contributor programs
            - CNCF, Apache, NumFOCUS, Python, R, Jupyter, Mozilla, Kubernetes and comparable ecosystems
            - project-specific fellowships or mentorship programs

            B. AI / ML / DATA / RESEARCH
            Search:
            - AI/ML summer research internships
            - undergraduate research fellowships
            - university research internships
            - institute research programs
            - AI fellowships
            - data science fellowships
            - computational science programs
            - research programs in India, Asia and globally that accept international students

            C. INDIA / GOVERNMENT / PUBLIC-SECTOR
            Search official pages for:
            - MeitY
            - Ministry of Education
            - Ministry of Science & Technology
            - DST
            - DBT
            - CSIR labs
            - ISRO
            - IISc / IITs / IISERs / NITs
            - NHAI
            - MoEFCC
            - other Indian ministries, public research institutes and national labs
            Exclude DRDO from active targeting.

            D. GLOBAL UNIVERSITY / INDUSTRY PROGRAMS
            Search:
            - undergraduate summer research
            - international summer research
            - software engineering internships
            - AI research internships
            - student fellowships
            - developer/student ambassador programs where substantive technical/community work is involved
            - early-career builder programs

            E. HACKATHONS / STUDENT PROGRAMS
            Search:
            - major technical hackathons
            - recurring global student competitions
            - AI/ML competitions
            - developer challenges
            - innovation programs with meaningful technical outcomes

            F. DISCOVERY SOURCES
            Use reputable opportunity aggregators, GitHub opportunity lists, university opportunity pages, newsletters and community pages ONLY to discover candidates.
            Every candidate must be verified against an official organizer/program source before being treated as confirmed.
            Do not use aggregators as the sole source for deadline, eligibility, stipend or application claims.

            SEARCH BEHAVIOR:
            - Use multiple distinct queries per source family.
            - Search both program names and generic opportunity phrases.
            - Search current-year and next-cycle language such as "2027", "2026-27", "2027 summer", "applications open", "call for applications", "fellowship", "internship", "mentorship", "student program".
            - Search official domains where possible.
            - Look beyond the first page of results when necessary.
            - Search for newly announced 2027 cycles even when applications are not open yet.
            - Search for programs that are recurring but NOT already represented in MASTER_LIST.md.
            - Do not stop after finding a few known programs.

            TARGET DISCOVERY VOLUME:
            Aim to inspect at least 20 plausible candidate opportunities per run across multiple categories before concluding that there are no genuinely new programs.
            A candidate does NOT need to be currently open to count as a NEW PROGRAM if it is a real recurring program relevant to the user and has credible official evidence.
            "No new programs" is an acceptable result only after broad search and deduplication.

            ============================================================
            PHASE 2 — DEDUPLICATE AGAINST MASTER_LIST.md
            ============================================================

            MASTER_LIST.md is the source of truth for whether a program is already known.

            For EVERY candidate:
            1. Compare exact program name.
            2. Compare organizer.
            3. Compare official URL/domain.
            4. Compare description, eligibility, cycle, and track structure.
            5. Detect renamed programs and aliases.
            6. Detect recurring annual programs already represented.
            7. Detect parent program vs child track.
            8. Detect multiple application routes for the same underlying program.

            Only classify as NEW when it is genuinely absent from the master list.

            IMPORTANT:
            - If a known program has a new deadline/window, put it under CHANGES, not NEW PROGRAMS.
            - If a known program launches a materially distinct track with separate eligibility/application, explain why it is a distinct track before calling it NEW.
            - If uncertain whether two records are duplicates, classify as "POSSIBLE DUPLICATE / WATCH" rather than pretending it is new.
            - Never add anything to MASTER_LIST.md during this workflow.

            ============================================================
            PHASE 3 — VERIFY EACH NEW CANDIDATE
            ============================================================

            For each candidate that survives deduplication, verify:
            - official program name
            - organizer
            - official source
            - eligibility
            - whether Indian students are eligible
            - academic-year/year-of-study requirements
            - application fee
            - paid/stipend/funding status
            - application opening and deadline
            - program dates
            - whether 2027 participation is confirmed, expected/recurring, or unknown
            - relevance to the user's profile

            Never infer India eligibility from "international" wording alone.
            Never infer stipend from past cycles unless explicitly labeled historical/expected.
            Never turn a past cycle into a confirmed 2027 cycle.

            APPLICATION-FEE FILTER:
            If an opportunity requires an application fee, exclude it from active targeting and do not put it in NEW PROGRAMS unless the fee is only for an optional service unrelated to applying. If excluded, it may be mentioned briefly under CHANGES/WATCH only when materially relevant.

            EXCLUSIONS:
            - DRDO: do not actively recommend or surface as a target.
            - LLNL DSSI: do not re-add/recommend.
            - UChicago DSI Summer Lab: do not re-add/recommend.
            - OIST: retain historical master-list awareness, but exclude from active targeting because the user does not want application-fee programs.

            ============================================================
            PHASE 4 — CHANGES AND UPCOMING
            ============================================================

            After NEW discovery, inspect existing master-list programs for:
            - newly opened applications
            - newly announced 2027 cycles
            - changed deadlines
            - changed eligibility
            - changed stipend/funding
            - changed program dates
            - official cancellation/pause
            - newly published application guidance

            Focus UPCOMING 3 MONTHS on the next 90 days.
            DEADLINE ALERTS = confirmed deadlines within 30 days.
            EARLY-PREP ALERTS = opportunities roughly 2–3 months away where preparation should begin now.

            For GSoC:
            - 2027 official dates must not be invented.
            - If Google has not published 2027 dates, explicitly say "2027 dates not yet officially published".
            - You may use the 2026 timeline only as a clearly labeled planning assumption.
            - Search for org lists, contributor guides, project ideas, issue trackers and community channels as preparation signals.

            ============================================================
            PHASE 5 — QUALITY CONTROL
            ============================================================

            Before writing the dashboard, run this checklist:

            [ ] Did I read MASTER_LIST.md completely?
            [ ] Did I search multiple categories?
            [ ] Did I inspect at least 20 plausible candidates unless search availability genuinely prevented it?
            [ ] Did I verify new candidates against official sources?
            [ ] Did I compare every candidate against the master list?
            [ ] Did I separate NEW from CHANGES?
            [ ] Did I exclude fee-based active targets?
            [ ] Did I exclude DRDO, LLNL DSSI, UChicago DSI Summer Lab and OIST from active targeting?
            [ ] Did I avoid inventing 2027 dates?
            [ ] Did I preserve accountability from the existing dashboard?
            [ ] Did I avoid claiming the user completed anything?
            [ ] Did I include source URLs for important current claims?

            If NEW PROGRAMS is empty after this process, write a short "Search coverage" note under NEW PROGRAMS stating which source families were searched and approximately how many candidates were checked. Do NOT simply say "No new programs found."

            ============================================================
            OUTPUT
            ============================================================

            Rewrite DAILY_DASHBOARD.md with exactly these sections:

            # Daily Opportunity Dashboard
            ## Date
            ## NEW PROGRAMS
            ## CHANGES
            ## UPCOMING 3 MONTHS
            ## EARLY-PREP ALERTS
            ## DEADLINE ALERTS
            ## TODAY'S TODO
            ## GSoC / OSS ACTION
            ## ACCOUNTABILITY
            ## SOURCES

            NEW PROGRAMS format:
            - Program
            - Why genuinely new
            - Organizer
            - Eligibility
            - India eligibility
            - Fee
            - Paid/unpaid/funding
            - 2027 status: confirmed / expected-recurring / unknown
            - Deadline/window
            - Relevance
            - Official source URL

            TODAY'S TODO:
            Give 3–7 concrete actions ordered by urgency.
            For OSS programs, prefer codebase reading, issue triage, reproducing bugs, tests, docs, discussions, reviews and maintainer interaction over meaningless PR volume.

            ACCOUNTABILITY:
            Read the previous dashboard and preserve unfinished/completed context. Never fabricate completion. If yesterday's task was not completed, identify the blocker and create a smaller recovery task.

            IMPORTANT:
            - Update ONLY DAILY_DASHBOARD.md.
            - Never modify MASTER_LIST.md, SCOUT_RULES.md or workflow files.
            - Never invent facts.
            - Never make political recommendations or rankings.
            - Keep the final dashboard concise enough to read on a phone, but include enough evidence to show that discovery was genuinely broad.
        run: |
          copilot -p "$SCOUT_PROMPT" -s --no-ask-user --allow-tool='read,write(DAILY_DASHBOARD.md),url' --allow-all-urls

      - name: Commit daily dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DAILY_DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "chore: update daily opportunity dashboard"
          git push
